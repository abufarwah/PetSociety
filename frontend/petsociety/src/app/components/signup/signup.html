
    <div class="container-fluid">
  <div class="row vh-100">

    <!-- Left Image -->
    <div class="col-md-6 p-0 d-flex align-items-center justify-content-center bg-image-container">
      <img src="/PetPic.png" class="signup-image">
    </div>

    <!-- Right sign up Form -->
    <div class="col-md-6 d-flex justify-content-center align-items-center">
      <div class="signup-box p-5 shadow-sm rounded-4">
        
        <div class="text-center mb-4">
          <h3>Join Our Pet Community!<i class="fa-solid fa-paw"></i></h3>
          <p class="text-muted">Tell us about you and your beloved pet</p>
        </div>

        <form [formGroup]="signupnForm" (ngSubmit)="signup()">
          <label class="mb-1">Your Name</label>
          <input type="text" class="form-control mb-3" placeholder="Enter your name">

          <label class="mb-1">Phone Number</label>
          <input type="text" class="form-control mb-3" placeholder="+(962)*******">

          <label class="mb-1">Email Address</label>
          <input
            type="email"
            class="form-control mb-3"
            placeholder="paw@gmail.com"
            formControlName="email"
          />



          <label class="mb-1">Password</label>
          <input
            type="password"
            class="form-control mb-3"
            placeholder="********"
            formControlName="Password"
          />

          <label class="mb-1">Password</label>
          <input
            type="password"
            class="form-control mb-3"
            placeholder="********"
            formControlName="password"
          />
          

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <input type="checkbox" id="remember">
              <label for="remember"> Remember me</label>
            </div>
           
          </div>

           <button
            type="submit"
            class="btn signup-btn  w-100"
            [disabled]="signupnForm.invalid">
            Sign Up
          </button>

          <a href="./login" class="d-block text-center mt-3">Already have an account? Log In</a>
        </form>
      </div>
    </div>
    

  </div>
</div>
