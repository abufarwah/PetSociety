<div class="modal-backdrop-custom" (click)="close.emit()"></div>

<div class="modal-box" (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="modal-header">
    <h3>Post Pet for Adoption</h3>
    <button class="close-btn" (click)="close.emit()">×</button>
  </div>

  <!-- Body -->
  <div class="modal-body">

    <div class="form-group">
      <label>Pet Name *</label>
      <input type="text" placeholder="Enter pet name" [(ngModel)]="petName"
        name="petName" />

    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Type *</label>

        <select [(ngModel)]="petType" name="petType">
          <option value>Select type</option>
          <option value="Dog">Dog</option>
          <option value="Cat">Cat</option>
          <option value="Rabbit">Rabbit</option>
          <option value="Hamster">Hamster</option>
          <option value="Bird">Bird</option>
          <option value="Turtle">Turtle</option>
          <option value="Fish">Fish</option>
        </select>

      </div>

      <div class="form-group">
        <label>Age *</label>
        <select [(ngModel)]="petAge" name="petAge">
          <option value>Select age</option>
          <option value="Baby">Baby</option>
          <option value="Young">Young</option>
          <option value="Adult">Adult</option>
        </select>

      </div>
    </div>

    <div class="form-group">
      <label>Location *</label>
      <input type="text" placeholder="City, State" [(ngModel)]="petLocation" name="petLocation" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea placeholder="Tell us about this pet..." [(ngModel)]="petDescription" name="petDescription"></textarea>
    </div>

    <div class="form-group">
      <label>Pet Image *</label>

      <input
        type="file"
        accept="image/*"
        (change)="onImageSelected($event)" />

      <img
        *ngIf="imagePreview"
        [src]="imagePreview"
        class="preview-img" />
    </div>

    <div class="tags">
      <span
        class="tag"
        *ngFor="let tag of availableTags"
        [class.active]="selectedTags.includes(tag)"
        (click)="toggleTag(tag)">
        {{ tag }}
      </span>
    </div>

  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="cancel-btn" (click)="close.emit()">Cancel</button>
    <button class="submit-btn" (click)="submitPet()">Post Pet</button>
  </div>

</div>
