<div class="modal-backdrop-custom" (click)="close.emit()"></div>

<div class="modal-box" (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="modal-header">
    <h3>{{ pet?.id ? 'Edit Pet' : 'Post Pet for Adoption' }}</h3>
    <button class="close-btn" (click)="close.emit()">×</button>
  </div>

  <!-- Body -->
  <div class="modal-body">

    <div class="form-group">
  <label>Breed *</label>

  <input
    type="text"
    [(ngModel)]="petName"
    name="petName"
    #petNameRef="ngModel"
  />

  <small class="error"
    *ngIf="(petNameRef.touched || isSubmitted) && !petName">
    Breed is required
  </small>
</div>


    <div class="form-row">
      <div class="form-group">
  <label>Type *</label>

  <select
    [(ngModel)]="petType"
    name="petType"
    #petTypeRef="ngModel">
    <option value="">Select type</option>
    <option>Dog</option>
    <option>Cat</option>
    <option>Rabbit</option>
    <option>Hamster</option>
    <option>Bird</option>
    <option>Turtle</option>
    <option>Fish</option>
  </select>

  <small class="error"
    *ngIf="(petTypeRef.touched || isSubmitted) && !petType">
    Type is required
  </small>
</div>

      

     <div class="form-group">
  <label>Exact Age (years) *</label>

  <input
    type="number"
    min="0"
    step="0.1"
    [(ngModel)]="petAgeYears"
    name="petAgeYears"
    #petAgeYearsRef="ngModel" />

  <small class="error"
    *ngIf="(petAgeYearsRef.touched || isSubmitted) && petAgeYears === null">
    Exact age is required
  </small>
</div>

      <div class="form-group">
  <label>Gender *</label>

  <select
    [(ngModel)]="petGender"
    name="petGender"
    #petGenderRef="ngModel">
    <option value="">Select gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>

  <small class="error"
    *ngIf="(petGenderRef.touched || isSubmitted) && !petGender">
    Gender is required
  </small>
</div>

    </div>

    <div class="form-group">
      <label>Description (Health Status)</label>
      <textarea placeholder="Tell us about this pet and their health status..." [(ngModel)]="petDescription" name="petDescription"></textarea>
    </div>

    <div class="form-group">
      <label>Pet Image *</label>

      <input
        type="file"
        accept="image/*"
        (change)="onImageSelected($event)" />

      <img
        *ngIf="imagePreview"
        [src]="imagePreview"
        class="preview-img" />

      <small class="error" *ngIf="isSubmitted && !selectedImageFile && !pet?.id">
        Please upload an image
      </small>
    </div>

    <div class="tags">
      <span
        class="tag"
        *ngFor="let tag of availableTags"
        [class.active]="selectedTags.includes(tag)"
        (click)="toggleTag(tag)">
        {{ tag }}
      </span>
    </div>

  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="cancel-btn" (click)="close.emit()">Cancel</button>
    <button class="submit-btn" (click)="submitPet()">
      {{ pet?.id ? 'Update Pet' : 'Post Pet' }}
    </button>
  </div>

</div>
