<div class="container-fluid p-0 login-container">
  <div class="row g-0 full-height-row">

    <!-- Left Image -->
    <div class="col-md-5 col-lg-6 d-none d-md-block p-0 bg-image-container">
      <img src="/PetPic.png" class="login-image w-100 h-100" alt="Pet Image" />
    </div>

    <!-- Right Login Form -->
    <div class="col-md-7 col-lg-6 d-flex justify-content-center align-items-center">
      <div class="login-box shadow-sm">
        
        <div class="text-center mb-4">
          <h3 class="fw-bold">
            Welcome Back! <i class="fa-solid fa-paw ms-2" style="color: #b88a60;"></i>
          </h3>
          <p class="text-muted">
            Login to reunite with your furry friends
          </p>
        </div>

        <!-- FORM -->
        <form [formGroup]="loginForm" (ngSubmit)="login()">

          <!-- Email -->
          <div class="mb-3">
            <label class="mb-1">Email Address</label>
            <div class="input-group">
              <span class="input-group-text border-end-0"><i class="fa-solid fa-envelope"></i></span>
              <input
                type="email"
                class="form-control ps-0"
                placeholder="paw@gmail.com"
                formControlName="email"
                [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
              />
            </div>
            <div class="text-danger small mt-1" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <span *ngIf="loginForm.get('email')?.errors?.['required']"><i class="fa-solid fa-circle-exclamation me-1"></i>Email is required</span>
              <span *ngIf="loginForm.get('email')?.errors?.['email']"><i class="fa-solid fa-circle-exclamation me-1"></i>Please enter a valid email address</span>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="mb-1">Password</label>
            <div class="input-group">
              <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control border-end-0 ps-0"
                placeholder="••••••••"
                formControlName="password"
                [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                style="border-radius: 0;"
              />
              <button type="button" class="input-group-text bg-transparent border-start-0 text-muted" (click)="showPassword = !showPassword" style="border-radius: 0 12px 12px 0; cursor: pointer; border: 1.5px solid #e8ded3;">
                <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
              </button>
            </div>
            <div class="text-danger small mt-1" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              <span *ngIf="loginForm.get('password')?.errors?.['required']"><i class="fa-solid fa-circle-exclamation me-1"></i>Password is required</span>
              <span *ngIf="loginForm.get('password')?.errors?.['minlength']"><i class="fa-solid fa-circle-exclamation me-1"></i>Password must be at least 8 characters</span>
            </div>
          </div>

          <!-- Options -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember"> Remember me</label>
            </div>
            <a href="#" class="text-decoration-none fw-semibold">
              Forgot Password?
            </a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="btn login-btn w-100 mb-3"
            [disabled]="loginForm.invalid">
            Login
          </button>

          <!-- Signup Link -->
          <p class="text-center mb-0 text-muted">
            New to Pet Society? 
            <a href="/signup" class="d-inline-block text-decoration-none fw-bold ms-1">Join Us</a>
          </p>

        </form>

      </div>
    </div>

  </div>
</div>
